name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/meal-plan-management-bd9sgo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 하나만 진행하고, 큐에 쌓인 건 최신 것만 남긴다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: 정적 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
